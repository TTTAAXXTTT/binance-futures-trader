name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frequi/quant/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check public files
        run: python tools/check_publication.py
      - name: Build frontend
        working-directory: frequi/quant
        run: |
          npm ci
          npm run build
          node verify-connection-check.mjs
      - name: Offline regression suite
        run: python -X utf8 tools/verify_hourly.py
